<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GivingEar</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #77756e; --line: #e4e1d8;
  --ai: #ece9e0; --accent: #2f6f5e;
  --c0: #2f6fdb; --c1: #d9622b; --c2: #2e9a6a; --c3: #a54bc4; --c4: #c79a12; --c5: #d23f6e;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #151514; --panel: #1f1f1d; --ink: #ecebe6; --muted: #8e8c84; --line: #302f2c; --ai: #2a2927; --accent: #5fb89f;
    --c0: #6c9cf5; --c1: #f0895a; --c2: #5cc796; --c3: #cb85e3; --c4: #e0bb4a; --c5: #ef7a9f; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
header h1 { font-size: 17px; margin: 0; letter-spacing: .02em; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.dot.on { background: var(--c2); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c2) 25%, transparent); }
#state { color: var(--muted); font-size: 13px; }
header .sp { flex: 1; }
button { font: inherit; font-size: 13px; padding: 5px 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button.primary.stop { background: var(--c5); border-color: var(--c5); }
button:disabled { opacity: .5; cursor: default; }
#banner { margin: 12px 20px 0; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font-size: 14px; display: flex; gap: 10px; align-items: center; }
#banner.err { border-color: var(--c5); } #banner.ok { border-color: var(--c2); } #banner.todo { border-color: var(--accent); }
#banner .sp { flex: 1; } #banner[hidden] { display: none; }
.card .reg { font-size: 11px; color: var(--c2); font-weight: 600; margin-left: auto; }
.card button { margin-top: 6px; font-size: 12px; padding: 3px 9px; }
main { display: grid; grid-template-columns: 250px 1fr 300px; gap: 16px; padding: 16px 20px; height: calc(100vh - 57px - var(--bh, 0px)); }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-height: 0; display: flex; flex-direction: column; }
h2 { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .08em; margin: 0 0 10px; text-transform: uppercase; }
#speakers { display: flex; flex-direction: column; gap: 8px; overflow: auto; }
.card { border: 1px solid var(--line); border-left: 4px solid var(--col); border-radius: 8px; padding: 8px 10px; transition: background .15s; }
.card.speaking { background: color-mix(in srgb, var(--col) 14%, transparent); }
.card .n { display: flex; align-items: center; gap: 6px; font-weight: 600; }
.card .n i { width: 8px; height: 8px; border-radius: 50%; background: var(--col); opacity: .25; }
.card.speaking .n i { opacity: 1; animation: pulse 1s infinite; }
.card small { color: var(--muted); display: block; }
.card .al { font-size: 12px; color: var(--muted); }
@keyframes pulse { 50% { transform: scale(1.6); } }
#chat { overflow: auto; display: flex; flex-direction: column; gap: 10px; flex: 1; padding-right: 4px; }
.msg { max-width: 80%; }
.msg .who { font-size: 12px; font-weight: 600; color: var(--col); margin-bottom: 2px; }
.msg .t { background: color-mix(in srgb, var(--col) 11%, var(--panel)); border: 1px solid color-mix(in srgb, var(--col) 30%, var(--line)); padding: 7px 11px; border-radius: 4px 12px 12px 12px; }
.msg.ai { align-self: flex-end; --col: var(--accent); }
.msg.ai .t { background: var(--ai); border-radius: 12px 4px 12px 12px; border-color: var(--line); }
.msg.ai .who { text-align: right; }
.note { align-self: center; font-size: 12px; color: var(--muted); background: var(--bg); padding: 2px 10px; border-radius: 99px; }
#timeline { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
.lane { position: relative; height: 18px; margin: 3px 0 3px 70px; background: color-mix(in srgb, var(--muted) 8%, transparent); border-radius: 4px; overflow: hidden; }
.lane > b { position: absolute; left: -70px; top: 0; width: 64px; text-align: right; font-size: 11px; font-weight: 500; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 18px; }
.seg { position: absolute; top: 2px; bottom: 2px; background: var(--col); border-radius: 3px; min-width: 2px; }
.lane { overflow: visible; } .lane .clip { position: absolute; inset: 0; overflow: hidden; border-radius: 4px; }
#log { overflow: auto; font: 12px/1.5 ui-monospace, Menlo, monospace; flex: 1; }
#log div { padding: 2px 0; border-bottom: 1px dashed var(--line); word-break: break-all; }
#log .k { color: var(--accent); font-weight: 600; }
#roster { font-size: 12px; color: var(--muted); margin-bottom: 10px; white-space: pre-wrap; }
.empty { color: var(--muted); font-size: 13px; }
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); padding: 18px 20px; width: min(420px, 92vw); }
dialog::backdrop { background: rgba(0,0,0,.4); }
dialog h3 { margin: 0 0 12px; font-size: 16px; }
dialog form { display: flex; flex-direction: column; gap: 8px; }
dialog input { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
dialog select { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
dialog #customfields, dialog #voicefields, dialog #qwenfields, dialog #cosyfields, dialog #macfields { display: flex; flex-direction: column; gap: 8px; }
dialog #customfields[hidden], dialog #voicefields[hidden], dialog #qwenfields[hidden], dialog #cosyfields[hidden], dialog #macfields[hidden] { display: none; }
dialog .row { display: flex; gap: 8px; align-items: center; }
dialog .row .grow { flex: 1; }
.err.ok { color: var(--c2); }
.err { color: var(--c5); font-size: 13px; min-height: 1.2em; }
.hint { color: var(--muted); font-size: 12px; }
.vp { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.vp .nm { flex: 1; font-weight: 600; } .vp small { color: var(--muted); display: block; font-weight: 400; }
button.danger:hover { border-color: var(--c5); color: var(--c5); }
@media (max-width: 900px) { main { grid-template-columns: 1fr; height: auto; } #chat, #log { max-height: 50vh; } }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>GivingEar</h1>
  <span id="state">未连接</span>
  <span class="sp"></span>
  <button id="startstop" class="primary">开始监听</button>
  <button id="settings">设置</button>
  <button id="acct">账号</button>
  <button id="demo">演示</button>
  <button id="clear">清空</button>
</header>
<div id="banner" hidden></div>
<main>
  <section>
    <h2>房间里的人</h2>
    <div id="speakers"><div class="empty">还没有人开口</div></div>
  </section>
  <section>
    <h2>对话</h2>
    <div id="chat"></div>
    <div id="timeline"><h2>谁在说话（最近 60 秒）</h2><div id="lanes"></div></div>
  </section>
  <section>
    <h2>AI 收到的名单</h2>
    <div id="roster">—</div>
    <h2>事件流</h2>
    <div id="log"></div>
  </section>
</main>
<dialog id="setdlg">
  <h3>设置</h3>
  <form id="keyform" onsubmit="return false">
    <label class="hint" for="prov">用哪个模型</label>
    <select id="prov"></select>
    <div class="hint" id="provnote"></div>
    <div id="customfields" hidden>
      <input id="curl" placeholder="接口地址，例如 https://api.example.com/v1" autocomplete="off">
      <input id="cmodel" placeholder="模型名，例如 qwen-plus" autocomplete="off">
    </div>
    <div class="hint" id="keystatus"></div>
    <input id="keyin" type="password" placeholder="粘贴这个模型的 API 密钥（不改就留空）" autocomplete="off">
    <div class="hint" id="keyhelp"></div>
    <div id="voicefields" hidden>
      <label class="hint" for="ttsengine">AI 的声音</label>
      <select id="ttsengine"></select>
      <div id="macfields"><input id="zhvoice" placeholder="macOS 自带的中文声音名，例如 Tingting" autocomplete="off"></div>
      <div id="qwenfields" hidden>
        <input id="qvoice" placeholder="音色，例如 Cherry" autocomplete="off">
        <div class="hint" id="dskeystatus"></div>
        <input id="dskey" type="password" placeholder="DashScope（通义千问）API 密钥（不改就留空）" autocomplete="off">
        <div class="hint">在 <a href="https://bailian.console.aliyun.com/" target="_blank" rel="noopener">阿里云百炼</a> 申请。</div>
      </div>
      <div id="cosyfields" hidden>
        <input id="cosyurl" placeholder="CosyVoice 服务地址，例如 http://127.0.0.1:50000" autocomplete="off">
        <select id="cosymode"><option value="instruct2">instruct2：用一段参考录音克隆音色（CosyVoice 2/3）</option><option value="instruct">instruct：预置音色（CosyVoice-300M-Instruct）</option></select>
        <input id="cosyspk" placeholder="参考录音（WAV）的路径，或预置音色名" autocomplete="off">
        <input id="cosyrate" placeholder="采样率，默认 24000" autocomplete="off">
        <div class="hint">需要自己部署 CosyVoice 的服务，说明见 README。</div>
      </div>
      <div class="row" id="auditionrow"><select id="emotion"></select><button type="button" id="audition">试听</button><span class="hint" id="auditionmsg"></span></div>
    </div>
    <div class="err" id="keyerr"></div>
    <div class="row"><button type="button" id="savekey" class="primary">保存</button><button type="button" id="testconn">测试连接</button><button type="button" id="delkey" class="danger">删除密钥</button><span class="grow"></span><button type="button" class="close">关闭</button></div>
    <label class="hint"><input type="checkbox" id="aec" checked> 开启回声消除（戴耳机时可以关闭）</label>
  </form>
</dialog>
<dialog id="dlg">
  <div id="loggedout">
    <h3>账号</h3>
    <form id="authform" autocomplete="on">
      <input id="u" placeholder="用户名（字母、数字、下划线、连字符）" autocomplete="username" required>
      <input id="p" type="password" placeholder="密码（至少 8 位）" autocomplete="current-password" required>
      <div class="err" id="autherr"></div>
      <div class="row"><button type="submit" id="dologin">登录</button><button type="button" id="doreg">注册新账号</button><span class="grow"></span><button type="button" class="close">关闭</button></div>
      <div class="hint">声纹加密保存在这台电脑上，只有用密码才能解开。忘记密码无法找回里面的声纹。</div>
    </form>
  </div>
  <div id="loggedin" hidden>
    <h3>账号 <span id="who"></span></h3>
    <div id="vps"></div>
    <div class="err" id="vperr"></div>
    <div class="row" style="margin-top:10px"><button id="logout">退出登录</button><span class="grow"></span><button class="close">关闭</button></div>
    <div class="hint" style="margin-top:8px">登记新的声纹：用 <code>givingear --account 账号名</code> 启动，然后对 AI 说"帮我注册"。</div>
  </div>
</dialog>
<script>
const EXPECTED_API = 4; // 要和后台的 webapi.API_VERSION 一致
let wsPort = 8765;
const wsUrl = () => new URLSearchParams(location.search).get("ws") || `ws://127.0.0.1:${wsPort}`;
const WINDOW = 60;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let speakers, segs, open, now, lastWall, nColors, ws, demoTimer;
function reset() {
  speakers = {}; segs = []; open = {}; now = 0; lastWall = performance.now(); nColors = 0;
  $("chat").innerHTML = ""; $("log").innerHTML = ""; $("roster").textContent = "—"; render();
}

function spk(id, name) {
  if (!id) return null;
  let s = speakers[id];
  if (!s) s = speakers[id] = { id, name: name || id, color: `var(--c${nColors++ % 6})`, n: 0, talk: 0, speaking: false, aliases: [] };
  if (name) s.name = name;
  return s;
}

function say(cls, who, text, color) {
  const chat = $("chat");
  const stick = chat.scrollTop + chat.clientHeight >= chat.scrollHeight - 40;
  const d = document.createElement("div");
  d.className = "msg " + cls; if (color) d.style.setProperty("--col", color);
  d.innerHTML = `<div class="who">${esc(who)}</div><div class="t">${esc(text)}</div>`;
  chat.append(d); if (stick) chat.scrollTop = chat.scrollHeight;
  return d;
}
function note(text) {
  const d = document.createElement("div"); d.className = "note"; d.textContent = text;
  $("chat").append(d); $("chat").scrollTop = $("chat").scrollHeight;
}
function logLine(e) {
  const { type, wall_t, audio_t, ...rest } = e;
  const d = document.createElement("div");
  d.innerHTML = `<span class="k">${esc(type)}</span> ${esc(JSON.stringify(rest))}`;
  const log = $("log"); log.prepend(d); while (log.children.length > 200) log.lastChild.remove();
}

let aiMsg = null;
function handle(e) {
  if (e.audio_t != null) { now = Math.max(now, e.audio_t); lastWall = performance.now(); }
  logLine(e);
  switch (e.type) {
    case "status":
      $("state").textContent = { listening: "正在听", stopped: "已停止", session_ending: "AI 会话即将到时长上限" }[e.state] || e.state; break;
    case "session_started": reset(); logLine(e); refreshState(); break;
    case "account_loaded": if (e.names.length) note("已登录账号 " + e.username + "，已登记：" + e.names.join("、")); break;
    case "registered": { const s = spk(e.speaker_id, e.name); s.registered = true; note("已登记 " + e.name + " 的声纹"); break; }
    case "need_more_speech": note(`${e.name} 说的话还不够（${e.have_s} 秒 / 需要 ${e.need_s} 秒），请再多说几句`); break;
    case "profile_created": spk(e.speaker_id, e.name); break;
    case "profile_renamed": { const s = spk(e.speaker_id, e.name); s.aliases = e.aliases || []; note(`${e.old_name} → ${e.name}`); break; }
    case "speech_start": open[e.utterance_id] = { start: e.audio_t, id: null }; break;
    case "speaker_guess": {
      const o = open[e.utterance_id]; const s = spk(e.speaker_id, e.name);
      if (o && s) { o.id = s.id; s.speaking = true; }
      break;
    }
    case "speech_end": {
      const s = spk(e.speaker_id, e.name);
      if (s) { s.n++; s.talk += e.audio_t - e.start; segs.push({ id: s.id, a: e.start, b: e.audio_t }); }
      for (const [k, o] of Object.entries(open)) if (+k === e.utterance_id) delete open[k];
      for (const x of Object.values(speakers)) x.speaking = Object.values(open).some((o) => o.id === x.id);
      break;
    }
    case "transcript": { const s = spk(e.speaker_id, e.name); say("", s ? s.name : e.name, e.text, s && s.color); break; }
    case "name_hint": note(`“${e.heard}”可能是指 ${e.name}`); break;
    case "roster": $("roster").textContent = e.text; break;
    case "ai_text":
      if (!aiMsg) aiMsg = say("ai", "AI", "");
      aiMsg.querySelector(".t").textContent += e.text; $("chat").scrollTop = $("chat").scrollHeight; break;
    case "ai_interrupted": if (aiMsg) aiMsg.querySelector(".t").textContent += "（被打断）"; aiMsg = null; break;
    case "ai_turn_end": aiMsg = null; break;
    case "error": note("！" + e.message); break;
    case "closed": $("state").textContent = "已结束"; break;
    case "tool_call": break;
  }
  render();
}

function render() {
  const list = Object.values(speakers);
  $("speakers").innerHTML = list.length ? list.map((s) =>
    `<div class="card ${s.speaking ? "speaking" : ""}" style="--col:${s.color}">
       <div class="n"><i></i>${esc(s.name)}${s.registered ? '<span class="reg">已登记</span>' : ""}</div>
       <small>${s.n} 句 · 共 ${s.talk.toFixed(1)} 秒</small>
       ${canRegister(s) ? `<button data-register="${esc(s.id)}">登记声纹</button>` : ""}
       ${s.aliases.length ? `<span class="al">也可能被听成：${esc(s.aliases.join("、"))}</span>` : ""}
     </div>`).join("") : `<div class="empty">还没有人开口</div>`;
  drawLanes();
}

const canRegister = (s) => sessionState === "listening" && token && !s.registered && !s.id.startsWith("u");

function drawLanes() {
  const t = now + (ws && ws.readyState === 1 || demoTimer ? (performance.now() - lastWall) / 1000 : 0);
  const lo = Math.max(0, t - WINDOW), span = Math.max(WINDOW, t - lo);
  const pos = (x) => ((Math.max(x, lo) - lo) / span) * 100;
  $("lanes").innerHTML = Object.values(speakers).map((s) => {
    const mine = segs.filter((g) => g.id === s.id && g.b > lo).map((g) => [g.a, g.b]);
    for (const o of Object.values(open)) if (o.id === s.id) mine.push([o.start, t]);
    return `<div class="lane" style="--col:${s.color}"><b>${esc(s.name)}</b><div class="clip">` +
      mine.map(([a, b]) => `<div class="seg" style="left:${pos(a)}%;width:${pos(b) - pos(a)}%"></div>`).join("") + `</div></div>`;
  }).join("");
}
setInterval(() => { if (Object.keys(open).length || demoTimer) drawLanes(); }, 200);

function connect() {
  ws = new WebSocket(wsUrl());
  ws.onopen = () => { $("dot").classList.add("on"); $("state").textContent = "已连接，等待事件"; };
  ws.onmessage = (m) => handle(JSON.parse(m.data));
  ws.onclose = () => { $("dot").classList.remove("on"); if (!demoTimer) $("state").textContent = "未连接（每 2 秒重试）"; setTimeout(connect, 2000); };
  ws.onerror = () => ws.close();
}

// 演示：用一段预先写好的事件序列，没有麦克风也能看到页面的样子
const DEMO = [
  [0, { type: "status", state: "listening" }],
  [1, { type: "speech_start", audio_t: 1.0, utterance_id: 1 }],
  [2, { type: "profile_created", audio_t: 2.0, speaker_id: "s1", name: "说话人 1" }],
  [2, { type: "speaker_guess", audio_t: 2.0, utterance_id: 1, speaker_id: "s1", name: "说话人 1", new: true }],
  [4, { type: "speech_end", audio_t: 4.0, utterance_id: 1, speaker_id: "s1", name: "说话人 1", start: 1.0 }],
  [4.5, { type: "transcript", audio_t: 4.0, utterance_id: 1, speaker_id: "s1", name: "说话人 1", text: "你好，我叫 Leo。" }],
  [5, { type: "profile_renamed", speaker_id: "s1", old_name: "说话人 1", name: "Leo", aliases: ["利奥"] }],
  [5, { type: "roster", text: "[房间里的人：Leo（名字也可能被听成：利奥）]" }],
  [6, { type: "ai_text", text: "你好 Leo，很高兴认识你。" }],
  [7.5, { type: "ai_turn_end" }],
  [8, { type: "speech_start", audio_t: 8.0, utterance_id: 2 }],
  [9, { type: "profile_created", audio_t: 9.0, speaker_id: "s2", name: "说话人 2" }],
  [9, { type: "speaker_guess", audio_t: 9.0, utterance_id: 2, speaker_id: "s2", name: "说话人 2", new: true }],
  [11, { type: "speech_end", audio_t: 11.0, utterance_id: 2, speaker_id: "s2", name: "说话人 2", start: 8.0 }],
  [11.5, { type: "transcript", audio_t: 11.0, utterance_id: 2, speaker_id: "s2", name: "说话人 2", text: "我是 Jennifer，请多关照。" }],
  [12, { type: "profile_renamed", speaker_id: "s2", old_name: "说话人 2", name: "Jennifer", aliases: ["杰夫", "珍妮弗"] }],
  [14, { type: "speech_start", audio_t: 14.0, utterance_id: 3 }],
  [15, { type: "speaker_guess", audio_t: 15.0, utterance_id: 3, speaker_id: "s1", name: "Leo", score: 0.71, new: false }],
  [17, { type: "speech_end", audio_t: 17.0, utterance_id: 3, speaker_id: "s1", name: "Leo", start: 14.0 }],
  [17.5, { type: "transcript", audio_t: 17.0, utterance_id: 3, speaker_id: "s1", name: "Leo", text: "你觉得杰夫的发型怎么样？" }],
  [18, { type: "name_hint", audio_t: 17.0, heard: "杰夫", speaker_id: "s2", name: "Jennifer" }],
  [20, { type: "ai_text", text: "你说的“杰夫”应该是 Jennifer，" }],
  [21, { type: "ai_text", text: "她的发型很清爽。" }],
  [22, { type: "ai_turn_end" }],
];
$("demo").onclick = () => {
  if (demoTimer) return;
  reset(); $("state").textContent = "演示中";
  const t0 = performance.now(); let i = 0;
  demoTimer = setInterval(() => {
    const el = (performance.now() - t0) / 1000;
    while (i < DEMO.length && DEMO[i][0] <= el) { const e = { wall_t: 0, ...DEMO[i++][1] }; if (e.audio_t == null && e.type === "status") e.audio_t = 0; handle(e); }
    now = Math.max(now, el); lastWall = performance.now();
    if (i >= DEMO.length) { clearInterval(demoTimer); demoTimer = null; $("state").textContent = "演示结束"; render(); }
  }, 100);
};
$("clear").onclick = reset;

// ---- 账号 ----
let token = null;
try { token = sessionStorage.getItem("ge_token"); } catch {}
async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || "出错了"); e.status = r.status; throw e; }
  return j;
}
function setToken(t) { token = t; try { t ? sessionStorage.setItem("ge_token", t) : sessionStorage.removeItem("ge_token"); } catch {} }
async function refreshAccount() {
  $("autherr").textContent = $("vperr").textContent = "";
  if (token) {
    try {
      const j = await api("GET", "/api/speakers");
      $("who").textContent = j.username; $("acct").textContent = "账号：" + j.username;
      $("vps").innerHTML = j.speakers.length ? j.speakers.map((s) =>
        `<div class="vp"><div class="nm">${esc(s.name)}<small>登记于 ${new Date(s.registered_at * 1000).toLocaleString()}</small></div>
         <button data-rename="${esc(s.name)}">改名</button><button class="danger" data-del="${esc(s.name)}">删除</button></div>`).join("")
        : `<div class="empty">还没有登记任何人</div>`;
      $("loggedout").hidden = true; $("loggedin").hidden = false; return;
    } catch (e) { if (e.status !== 401) { $("vperr").textContent = e.message; return; } setToken(null); }
  }
  $("acct").textContent = "账号"; $("loggedout").hidden = false; $("loggedin").hidden = true;
}
async function auth(path) {
  try { const j = await api("POST", path, { username: $("u").value, password: $("p").value }); $("p").value = ""; setToken(j.token); await refreshAccount(); }
  catch (e) { $("autherr").textContent = e.message; }
}
$("acct").onclick = () => { refreshAccount(); $("dlg").showModal(); };
document.querySelectorAll(".close").forEach((b) => (b.onclick = () => $("dlg").close()));
$("authform").onsubmit = (ev) => { ev.preventDefault(); auth("/api/login"); };
$("doreg").onclick = () => { if ($("authform").reportValidity()) auth("/api/register"); };
$("logout").onclick = async () => { try { await api("POST", "/api/logout", {}); } catch {} setToken(null); refreshAccount(); };
$("vps").onclick = async (ev) => {
  const del = ev.target.dataset.del, ren = ev.target.dataset.rename;
  try {
    if (del && confirm(`确定让程序彻底忘记“${del}”的声纹吗？`)) await api("DELETE", "/api/speakers/" + encodeURIComponent(del));
    else if (ren) { const n = prompt("新名字", ren); if (n && n !== ren) await api("POST", "/api/speakers/rename", { old: ren, new: n }); }
    await refreshAccount();
  } catch (e) { $("vperr").textContent = e.message; }
};

// ---- 会话控制、设置、引导 ----
let sessionState = "idle", hasKey = false;
function banner(kind, html, ms = 0) {
  const b = $("banner"); b.className = kind; b.innerHTML = html; b.hidden = !html;
  document.documentElement.style.setProperty("--bh", html ? b.offsetHeight + 12 + "px" : "0px");
  if (ms) setTimeout(() => { if (b.innerHTML === html) banner("", ""); }, ms);
}
function guide() {
  if (!hasKey) banner("todo", `<b>第一步：</b>在设置里选好模型并填入密钥（现在选的是「${esc(providerById(info.provider).label || "")}」），才能让 AI 听和说。<span class="sp"></span><button id="gokey">去设置</button>`);
  else if (sessionState === "idle" && !token) banner("todo", `密钥已设置。点<b>开始监听</b>就能用；想让它记住你们的声音，先点右上角<b>账号</b>注册并登录。`);
  else if (sessionState === "listening" && !token) banner("todo", `正在监听。想让程序记住你们的声音，请先在<b>账号</b>里登录，再重新开始监听。`);
  else banner("", "");
  const g = $("gokey"); if (g) g.onclick = () => $("settings").click();
}
let info = { providers: [], settings: {}, provider: "gemini", tts_engines: [], tts_key: {}, emotions: [] };
const providerById = (id) => info.providers.find((p) => p.id === id) || {};
function fillSettings() {
  const sel = $("prov");
  sel.innerHTML = info.providers.map((p) => `<option value="${esc(p.id)}">${esc(p.label)}</option>`).join("");
  sel.value = info.provider; $("curl").value = info.settings.custom_base_url || ""; $("cmodel").value = info.settings.custom_model || "";
  $("zhvoice").value = info.settings.zh_voice || "";
  $("ttsengine").innerHTML = info.tts_engines.map((e) => `<option value="${esc(e.id)}">${esc(e.label)}</option>`).join("");
  $("ttsengine").value = info.settings.tts_engine || "mac";
  $("emotion").innerHTML = info.emotions.map((e) => `<option>${esc(e)}</option>`).join("");
  const st = info.settings;
  $("qvoice").value = st.qwen_voice || ""; $("cosyurl").value = st.cosyvoice_url || ""; $("cosymode").value = st.cosyvoice_mode || "instruct2";
  $("cosyspk").value = st.cosyvoice_speaker || ""; $("cosyrate").value = st.cosyvoice_rate || "";
  showProvider();
}
function showEngine() {
  const e = $("ttsengine").value;
  $("macfields").hidden = e !== "mac"; $("qwenfields").hidden = e !== "qwen"; $("cosyfields").hidden = e !== "cosyvoice";
  $("dskeystatus").textContent = info.tts_key.has_key ? `已设置密钥（末尾 ${(info.tts_key.hint || "").slice(1)}）` : "还没有设置密钥";
  $("auditionmsg").textContent = e === "mac" ? "本机声音只能通过语速、音高、音量表现情绪，想要更自然的情感请换引擎" : "";
}
function showProvider() {
  const p = providerById($("prov").value);
  $("provnote").textContent = p.note || "";
  $("customfields").hidden = p.id !== "custom"; $("voicefields").hidden = p.kind !== "chat"; showEngine();
  $("keystatus").textContent = p.has_key ? `已设置密钥（末尾 ${(p.hint || "").slice(1)}）` : "还没有设置密钥";
  $("keyhelp").innerHTML = p.id === "gemini" ? '在 <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a> 申请。密钥只保存在这台电脑上，不会再显示出来。'
    : p.id === "deepseek" ? '在 <a href="https://platform.deepseek.com/api_keys" target="_blank" rel="noopener">DeepSeek 开放平台</a> 申请。密钥只保存在这台电脑上，不会再显示出来。'
    : "在你使用的模型提供商的控制台申请。密钥只保存在这台电脑上，不会再显示出来。";
}
async function refreshState() {
  try {
    const s = await (await fetch("/api/state")).json();
    if (s.api_version !== EXPECTED_API) {  // 页面是新的，后台还是旧版本：不要硬用缺失的字段
      banner("err", `<b>页面已经更新，但后台还是旧版本。</b>请关闭 GivingEar 的终端窗口，重新双击 GivingEar.command。<span class="sp"></span>`);
      $("startstop").disabled = true; $("settings").disabled = true; return;
    }
    $("settings").disabled = false;
    wsPort = s.ws_port || wsPort; hasKey = s.has_key; sessionState = s.state;
    const changed = JSON.stringify([s.providers, s.provider, s.settings, s.tts_key]) !== JSON.stringify([info.providers, info.provider, info.settings, info.tts_key]);
    info = { providers: s.providers || [], settings: s.settings || {}, provider: s.provider, tts_engines: s.tts_engines || [], tts_key: s.tts_key || {}, emotions: s.emotions || [] };
    if (changed && !$("setdlg").open) fillSettings(); else if ($("setdlg").open) showProvider();
    const b = $("startstop"); b.disabled = s.state === "starting" || s.state === "unavailable";
    b.textContent = s.state === "listening" ? "停止监听" : s.state === "starting" ? "启动中…" : "开始监听";
    b.classList.toggle("stop", s.state === "listening");
    if (!demoTimer) guide();
    render();
  } catch { /* 服务没开着 */ }
}
$("startstop").onclick = async () => {
  try {
    if (sessionState === "listening") await api("POST", "/api/session/stop", {});
    else { banner("", ""); await api("POST", "/api/session/start", { aec: $("aec").checked }); }
  } catch (e) { banner("err", esc(e.message)); }
  refreshState();
};
$("settings").onclick = () => {
  $("keyerr").textContent = ""; $("keyerr").className = "err";
  try { fillSettings(); } catch (e) { keymsg("设置页加载出错：" + e.message); }  // 即使出错也要把弹窗打开，让人看到原因
  if (!$("setdlg").open) $("setdlg").showModal();
};
$("prov").onchange = showProvider;
$("ttsengine").onchange = showEngine;
let auditionAudio = null;
$("audition").onclick = async () => {
  $("auditionmsg").textContent = "正在合成…"; $("auditionmsg").className = "hint";
  try {
    await saveAll();
    const r = await api("POST", "/api/settings/test-voice", { emotion: $("emotion").value });
    if (!r.ok) { $("auditionmsg").textContent = r.message; return; }
    if (auditionAudio) auditionAudio.pause();
    auditionAudio = new Audio("data:audio/wav;base64," + r.wav); await auditionAudio.play(); $("auditionmsg").textContent = "";
  } catch (e) { $("auditionmsg").textContent = e.message; }
};
const keymsg = (text, ok) => { $("keyerr").textContent = text; $("keyerr").className = "err" + (ok ? " ok" : ""); };
async function saveAll() {
  const provider = $("prov").value;
  await api("POST", "/api/settings/provider", {
    provider, custom_base_url: $("curl").value, custom_model: $("cmodel").value, zh_voice: $("zhvoice").value || "Tingting",
    tts_engine: $("ttsengine").value, qwen_voice: $("qvoice").value || "Cherry", cosyvoice_url: $("cosyurl").value, cosyvoice_mode: $("cosymode").value,
    cosyvoice_speaker: $("cosyspk").value, cosyvoice_rate: $("cosyrate").value || "24000" });
  if ($("keyin").value.trim()) await api("POST", "/api/settings/key", { provider, key: $("keyin").value });
  if ($("dskey").value.trim()) await api("POST", "/api/settings/key", { provider: "dashscope", key: $("dskey").value });
  $("keyin").value = ""; $("dskey").value = "";
  await refreshState(); fillSettings(); $("prov").value = provider; showProvider();
}
$("savekey").onclick = async () => { try { await saveAll(); keymsg("已保存", true); banner("ok", "设置已保存", 3000); } catch (e) { keymsg(e.message); } };
$("delkey").onclick = async () => {
  try { await api("DELETE", "/api/settings/key?provider=" + encodeURIComponent($("prov").value)); await refreshState(); const v = $("prov").value; fillSettings(); $("prov").value = v; showProvider(); keymsg("已删除这个模型的密钥", true); }
  catch (e) { keymsg(e.message); }
};
$("testconn").onclick = async () => {
  keymsg("正在测试…", true);
  try { await saveAll(); const r = await api("POST", "/api/settings/test", {}); keymsg(r.message, r.ok); } catch (e) { keymsg(e.message); }
};
$("speakers").onclick = async (ev) => {
  const id = ev.target.dataset.register; if (!id) return;
  const s = speakers[id]; let name = "";
  if (/^说话人 \d+$/.test(s.name)) { name = prompt("这个人叫什么名字？") || ""; if (!name.trim()) return; }
  try {
    const r = await api("POST", "/api/session/register", { speaker_id: id, name });
    if (r.ok) banner("ok", `已登记 ${esc(r.name)}，下次开始监听就能直接认出来`, 5000);
    else if (r.need_more_speech) banner("err", `${esc(s.name)} 说的话还不够（${r.have_s} 秒 / 需要 ${r.need_s} 秒），请他再多说几句再试`, 6000);
    else banner("err", esc(r.error || "登记失败"), 6000);
  } catch (e) { banner("err", esc(e.message), 6000); }
};
document.querySelectorAll(".close").forEach((b) => (b.onclick = () => b.closest("dialog").close()));
setInterval(refreshState, 3000);

reset(); refreshState().then(connect); refreshAccount();
</script>
</body>
