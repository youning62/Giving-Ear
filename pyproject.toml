[project]
name = "givingear"
version = "0.2.0"
description = "Speaker identification for AI agents: who said what in a live room conversation (voiceprints, Chinese + English, local, macOS). 给 AI 一只耳朵：多人对话说话人识别"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Youning Zheng", email = "youning62@gmail.com" }
]
requires-python = ">=3.12"
keywords = [
    "speaker-identification", "speaker-diarization", "diarization", "voiceprint", "speaker-recognition",
    "who-said-what", "meeting-transcription", "transcription", "mcp", "mcp-server", "claude", "claude-code",
    "agent-skills", "skill", "macos", "chinese", "说话人识别", "声纹", "会议转写",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "cryptography>=46",
    "google-genai>=2.29.0",
    "jieba>=0.42.1",
    "mcp>=2.3,<3",
    "numpy>=2.5.4",
    "pyobjc-framework-avfoundation>=12.2.2; sys_platform == 'darwin'",
    "pypinyin>=0.55.0",
    "sherpa-onnx>=1.13.8",
    "sherpa-onnx-core>=1.13.8",
    "websockets>=14",
]

[project.urls]
Homepage = "https://github.com/youning62/Giving-Ear"
Repository = "https://github.com/youning62/Giving-Ear"
Issues = "https://github.com/youning62/Giving-Ear/issues"

[project.scripts]
givingear = "givingear.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
