[project]
name = "givingear"
version = "0.1.0"
description = "给 AI 一只耳朵：在多人语音对话中分辨是谁在讲话"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Youning Zheng", email = "youning62@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=46",
    "google-genai>=2.29.0",
    "jieba>=0.42.1",
    "numpy>=2.5.4",
    "pyobjc-framework-avfoundation>=12.2.2",
    "pypinyin>=0.55.0",
    "sherpa-onnx>=1.13.8",
    "sherpa-onnx-core>=1.13.8",
    "websockets>=14",
]

[project.scripts]
givingear = "givingear.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
